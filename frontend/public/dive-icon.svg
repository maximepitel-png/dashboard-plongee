  <!-- Reflet sur le verre -->
  <ellipse cx="26" cy="25" rx="5" ry="3" fill="#ffffff" opacity="0.35" transform="rotate(-15 26 25)"/>

  <!-- Jupe du masque (bas) -->
  <path d="M14 30 Q14 46 32 46 Q50 46 50 30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Sangle gauche -->
