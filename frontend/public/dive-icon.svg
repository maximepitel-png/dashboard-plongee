  <!-- Sangle droite -->
  <path d="M50 28 Q56 28 58 22" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bulles d'air -->
  <circle cx="44" cy="18" r="2.5" fill="none" stroke="#7ecef4" stroke-width="1.5"/>
  <circle cx="49" cy="12" r="1.8" fill="none" stroke="#7ecef4" stroke-width="1.5"/>
  <circle cx="54" cy="7"  r="1.2" fill="none" stroke="#7ecef4" stroke-width="1.2"/>
