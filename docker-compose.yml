version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dashboard-plongee-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/app/data
      - FRONTEND_URL=http://localhost:3000
      # Clé api-maree.fr (données Ifremer/PREVIMER) — obligatoire pour les marées
      # Créer un compte sur https://api-maree.fr puis décommenter :
      - MAREE_API_KEY=${MAREE_API_KEY}
    volumes:
      - ./data:/app/data
    networks:
      - plongee-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dashboard-plongee-frontend
    restart: unless-stopped
    ports:
      - "3080:80"
    depends_on:
      - backend
    networks:
      - plongee-net

  # Job quotidien : télécharge les données Copernicus Marine (ZSD/KD490/SPM/CHL)
  # et écrit ./data/satellite_clarity.json — le backend le lit sans jamais dépendre
  # de la disponibilité de l'API Copernicus au moment du rendu.
  #
  # Variables requises dans .env :
  #   COPERNICUS_USER=votre_identifiant_copernicus_marine
  #   COPERNICUS_PASSWORD=votre_mot_de_passe_copernicus_marine
  # Créer un compte gratuit sur https://marine.copernicus.eu
  satellite-clarity:
    build:
      context: ./satellite
      dockerfile: Dockerfile
    container_name: dashboard-plongee-satellite
    restart: unless-stopped
    environment:
      - DATA_DIR=/app/data
      - COPERNICUS_USER=${COPERNICUS_USER}
      - COPERNICUS_PASSWORD=${COPERNICUS_PASSWORD}
    volumes:
      - ./data:/app/data
    networks:
      - plongee-net

networks:
  plongee-net:
    driver: bridge

volumes:
  plongee-data:
