version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dashboard-plongee-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/app/data
      - FRONTEND_URL=http://localhost:3000
      # Clé WorldTides pour marées précises (https://www.worldtides.info/developer)
      # Décommentez et renseignez votre clé pour activer les marées officielles :
      # - WORLDTIDES_API_KEY=votre_clé_ici
    volumes:
      - ./data:/app/data
    networks:
      - plongee-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dashboard-plongee-frontend
    restart: unless-stopped
    ports:
      - "3080:80"
    depends_on:
      - backend
    networks:
      - plongee-net

networks:
  plongee-net:
    driver: bridge

volumes:
  plongee-data:
